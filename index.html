    <script>
      // Browser-side shim for process.env
      window.process = { 
        env: { 
          NODE_ENV: 'development',
          API_KEY: ''
        } 
      };
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('[Runtime Error]', msg, 'at', url, ':', lineNo);
        return false;
      };
    </script>
